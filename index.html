<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi4 AI Control Center</title>
    <style>
        /* Base Styling */
        body {background-color: #121212;color: #e0e0e0;font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;margin: 0;display: flex;flex-direction: column;height: 100vh;}
        
        /* Telemetry Status Bar */
        #telemetry-bar {background-color: #1e1e1e;padding: 15px 20px;display: flex;justify-content: space-around;border-bottom: 2px solid #333;font-size: 14px; font-weight: bold;box-shadow: 0 4px 6px rgba(0,0,0,0.3);}
        .stat { color: #4DA8DA; }
        .val { color: #ffffff; margin-left: 5px; transition: color 0.3s ease; }
        .error-text { color: #ff5252; }

        /* Chat Interface */
        #chat-container {flex-grow: 1;padding: 20px;overflow-y: auto;display: flex;flex-direction: column;gap: 15px;}
        .message {max-width: 80%;padding: 12px 16px;border-radius: 8px;line-height: 1.5;word-wrap: break-word;}
        .user-msg {background-color: #2979ff;color: white;align-self: flex-end;border-bottom-right-radius: 0;}
        .ai-msg {background-color: #2d2d2d;color: #e0e0e0;align-self: flex-start;border-bottom-left-radius: 0;border: 1px solid #444;}
        
        /* Timer Styling */
        .time-elapsed {display: block;font-size: 12px;color: #888888;margin-top: 10px;padding-top: 8px;border-top: 1px dashed #555;font-family: monospace;}

        /* Input Area */
        #input-area {background-color: #1e1e1e;padding: 15px 20px;display: flex;gap: 10px;border-top: 2px solid #333;}
        #chat-input {flex-grow: 1;background-color: #2d2d2d;border: 1px solid #444;color: white;padding: 12px;border-radius: 6px;font-size: 16px;outline: none;}
        #chat-input:focus {border-color: #4DA8DA;}
        #send-btn {background-color: #4DA8DA;color: #121212;border: none;padding: 0 25px;font-weight: bold;font-size: 16px;border-radius: 6px;cursor: pointer;transition: background 0.2s;}
        #send-btn:hover {background-color: #3b8bc2;}
        #send-btn:disabled {background-color: #555;cursor: not-allowed;}
    </style>
</head>
<body>

    <div id="telemetry-bar">
        <div><span class="stat">SYS TEMP:</span><span class="val" id="sys-temp">-- °C</span></div>
        <div><span class="stat">CPU LOAD:</span><span class="val" id="cpu-load">-- / 4.00</span></div>
        <div><span class="stat">CORE VOLT:</span><span class="val" id="core-volt">-- V</span></div>
        <div><span class="stat">RAM USAGE:</span><span class="val" id="ram-usage">-- / -- MB</span></div>
    </div>

    <div id="chat-container">
        <div class="message ai-msg">System Online. Qwen2.5-Coder:0.5B is ready. How can I help you today?</div>
    </div>

    <div id="input-area">
        <input type="text" id="chat-input" placeholder="Enter command or question..." autocomplete="off">
        <button id="send-btn">Send</button>
    </div>

    <script>
        // --- 1. TELEMETRY POLLING (Apache) ---
        async function fetchTelemetry() {
            try {
                const response = await fetch('https://ai.yong1412.my/telemetry/health.php');
                if (response.ok) {
                    const data = await response.json();
                    
                    // --- CPU Logic ---
                    const cpuRaw = parseFloat(data.cpu_load);
                    const cpuFormatted = cpuRaw.toFixed(2);
                    const cpuElement = document.getElementById('cpu-load');
                    
                    cpuElement.innerText = cpuFormatted + " / 4.00";
                    
                    // Apply conditional colors based on load
                    if (cpuRaw > 6.00) {
                        cpuElement.style.color = "#ff5252"; // Red
                    } else if (cpuRaw > 4.00) {
                        cpuElement.style.color = "#ffeb3b"; // Yellow
                    } else {
                        cpuElement.style.color = "#ffffff"; // Default White
                    }

                    // --- Other Telemetry ---
                    const voltFormatted = parseFloat(data.core_voltage).toFixed(2);
                    const ramUsed = Number(data.ram_used_mb).toLocaleString('en-US').replace(/,/g, '.');
                    const ramTotal = Number(data.ram_total_mb).toLocaleString('en-US').replace(/,/g, '.');

                    document.getElementById('sys-temp').innerText = data.temperature_c + " °C";
                    document.getElementById('core-volt').innerText = voltFormatted + " V";
                    document.getElementById('ram-usage').innerText = ramUsed + " / " + ramTotal + " MB";
                }
            } catch (error) {
                console.error("Telemetry failed:", error);
                document.getElementById('sys-temp').innerText = "OFFLINE";
                document.getElementById('sys-temp').className = "val error-text";
            }
        }
        
        fetchTelemetry();
        setInterval(fetchTelemetry, 500);

        // --- 2. AI CHAT ENGINE (Ollama) ---
        const chatContainer = document.getElementById('chat-container');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        let messageHistory = [];

        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            // 1. Display User Message
            appendMessage(text, 'user-msg');
            chatInput.value = '';
            sendBtn.disabled = true;
            messageHistory.push({ role: "user", content: text });

            // 2. Setup AI UI (Text Area + Live Timer Area)
            const loadingId = "ai-" + Date.now();
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message ai-msg';
            msgDiv.id = loadingId;
            
            const textDiv = document.createElement('div');
            textDiv.innerText = "Thinking...";
            msgDiv.appendChild(textDiv);

            const timerDiv = document.createElement('div');
            timerDiv.className = 'time-elapsed';
            timerDiv.innerText = `⏱️ Processed in 0.00s`;
            msgDiv.appendChild(timerDiv);

            chatContainer.appendChild(msgDiv);
            scrollToBottom();

            // 3. Start Live Timer
            const startTime = performance.now();
            let timerInterval = setInterval(() => {
                const currentElapsed = ((performance.now() - startTime) / 1000).toFixed(2);
                timerDiv.innerText = `⏱️ Processed in ${currentElapsed}s`;
            }, 50);

            try {
                // 4. Send to Ollama via Stream
                const response = await fetch('https://chat.yong1412.my/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: 'qwen2.5-coder:0.5b',
                        messages: messageHistory,
                        stream: true,
                        keep_alive: -1,
                        options: { num_thread: 4, num_ctx: 1024 }
                    })
                });

                if (!response.ok) throw new Error("AI Server Error");

                // 5. Read Stream Chunks
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullResponse = "";
                let isFirstChunk = true;
                let buffer = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    
                    buffer = lines.pop(); 

                    for (const line of lines) {
                        if (line.trim()) {
                            const data = JSON.parse(line);
                            if (data.message && data.message.content) {
                                if (isFirstChunk) {
                                    textDiv.innerText = "";
                                    isFirstChunk = false;
                                }
                                fullResponse += data.message.content;
                                textDiv.innerText = fullResponse;
                                scrollToBottom();
                            }
                        }
                    }
                }

                // 6. Finalize Time and History
                clearInterval(timerInterval);
                const finalTime = ((performance.now() - startTime) / 1000).toFixed(2);
                timerDiv.innerText = `⏱️ Processed in ${finalTime}s`;
                messageHistory.push({ role: "assistant", content: fullResponse });

            } catch (error) {
                console.error(error);
                clearInterval(timerInterval);
                textDiv.innerText = "ERROR: Could not connect to Qwen2.5 on Raspberry Pi.";
                textDiv.style.color = "#ff5252";
            } finally {
                sendBtn.disabled = false;
                chatInput.focus();
                scrollToBottom();
            }
        }

        function appendMessage(text, className) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.innerText = text;
            chatContainer.appendChild(msgDiv);
            scrollToBottom();
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        chatInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        });

        sendBtn.addEventListener('click', sendMessage);
    </script>
</body>
</html>
