<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi4 AI Control Center</title>
    <style>
        /* Base Styling */
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Telemetry Status Bar */
        #telemetry-bar {
            background-color: #1e1e1e;
            padding: 15px 20px;
            display: flex;
            justify-content: space-around;
            border-bottom: 2px solid #333;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .stat { color: #4DA8DA; }
        .val { color: #ffffff; margin-left: 5px; }
        .error-text { color: #ff5252; }

        /* Chat Interface */
        #chat-container {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        
        .user-msg {
            background-color: #2979ff;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 0;
        }
        
        .ai-msg {
            background-color: #2d2d2d;
            color: #e0e0e0;
            align-self: flex-start;
            border-bottom-left-radius: 0;
            border: 1px solid #444;
        }

        /* Input Area */
        #input-area {
            background-color: #1e1e1e;
            padding: 15px 20px;
            display: flex;
            gap: 10px;
            border-top: 2px solid #333;
        }

        #chat-input {
            flex-grow: 1;
            background-color: #2d2d2d;
            border: 1px solid #444;
            color: white;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }
        
        #chat-input:focus {
            border-color: #4DA8DA;
        }

        #send-btn {
            background-color: #4DA8DA;
            color: #121212;
            border: none;
            padding: 0 25px;
            font-weight: bold;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        #send-btn:hover {
            background-color: #3b8bc2;
        }
        
        #send-btn:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div id="telemetry-bar">
        <div><span class="stat">SYS TEMP:</span><span class="val" id="sys-temp">-- °C</span></div>
        <div><span class="stat">CPU LOAD:</span><span class="val" id="cpu-load">-- %</span></div>
        <div><span class="stat">CORE VOLT:</span><span class="val" id="core-volt">-- V</span></div>
        <div><span class="stat">RAM USAGE:</span><span class="val" id="ram-usage">-- / -- MB</span></div>
    </div>

    <div id="chat-container">
        <div class="message ai-msg">System Online. Qwen2.5-Coder:0.5B is ready. How can I help you today?</div>
    </div>

    <div id="input-area">
        <input type="text" id="chat-input" placeholder="Enter command or question..." autocomplete="off">
        <button id="send-btn">Send</button>
    </div>

    <script>
        // --- 1. TELEMETRY POLLING (Apache) ---
        async function fetchTelemetry() {
            try {
                // Calls your PHP script routed through Cloudflare
                const response = await fetch('https://ai.yong1412.my/telemetry/health.php');
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('sys-temp').innerText = data.temperature_c + " °C";
                    document.getElementById('core-volt').innerText = data.core_voltage + " V"; // <-- NEW LINE
                    document.getElementById('cpu-load').innerText = data.cpu_load;
                    document.getElementById('ram-usage').innerText = data.ram_used_mb + " / " + data.ram_total_mb + " MB";
                }
            } catch (error) {
                console.error("Telemetry failed:", error);
                document.getElementById('sys-temp').innerText = "OFFLINE";
                document.getElementById('sys-temp').className = "val error-text";
            }
        }
        
        // Fetch stats immediately, then update every 5 seconds
        fetchTelemetry();
        setInterval(fetchTelemetry, 500);


        // --- 2. AI CHAT ENGINE (Ollama) ---
        const chatContainer = document.getElementById('chat-container');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        
        // Store conversation context for the AI
        let messageHistory = [];

        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            // 1. Display User Message
            appendMessage(text, 'user-msg');
            chatInput.value = '';
            sendBtn.disabled = true;
            
            // Add to history array
            messageHistory.push({ role: "user", content: text });

            // 2. Setup AI Loading State
            const loadingId = "loading-" + Date.now();
            appendMessage("Thinking...", 'ai-msg', loadingId);

            try {
                // 3. Send to Ollama via Cloudflare Tunnel
                const response = await fetch('https://chat.yong1412.my/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: 'qwen2.5-coder:0.5b',
                        messages: messageHistory,
                        stream: false, // Wait for full response for simplicity
                        keep_alive: -1, // Maximum speed tweak: NEVER unload from RAM
                        options: {
                            num_thread: 4, // Maximum speed tweak: Use all Pi4 Cores
                            num_ctx: 1024  // Maximum speed tweak: Shorter context memory
                        }
                    })
                });

                if (!response.ok) throw new Error("AI Server Error");

                const data = await response.json();
                const aiResponse = data.message.content;

                // 4. Update UI and History
                document.getElementById(loadingId).innerText = aiResponse;
                messageHistory.push({ role: "assistant", content: aiResponse });

            } catch (error) {
                console.error(error);
                document.getElementById(loadingId).innerText = "ERROR: Could not connect to Qwen2.5 on Raspberry Pi.";
                document.getElementById(loadingId).style.color = "#ff5252";
            } finally {
                sendBtn.disabled = false;
                chatInput.focus();
                scrollToBottom();
            }
        }

        // --- Helper Functions ---
        function appendMessage(text, className, id = "") {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            if (id) msgDiv.id = id;
            msgDiv.innerText = text; // innerText safely escapes HTML tags in code
            chatContainer.appendChild(msgDiv);
            scrollToBottom();
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Allow pressing "Enter" to send
        chatInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        });

        sendBtn.addEventListener('click', sendMessage);
    </script>
</body>
</html>
