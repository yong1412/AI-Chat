<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pi4 AI Control Center</title>
    <style>
        /* Base Styling */
        body {background-color: #131314;color: #e3e3e3;font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;margin: 0;display: flex;flex-direction: column;height: 100vh;}
        
        /* Telemetry Status Bar - Minimalist */
        #telemetry-bar {background-color: transparent;padding: 10px 20px;display: flex;justify-content: space-around;border-bottom: 1px solid #282a2c;font-size: 13px;}
        .stat { color: #888888; font-size: 11px; letter-spacing: 0.5px;}
        .val { color: #e3e3e3; margin-left: 5px; font-weight: 600; transition: color 0.3s ease; }
        .error-text { color: #ff5252; }

        /* Chat Interface */
        #chat-container {flex-grow: 1;padding: 20px 15px;overflow-y: auto;display: flex;flex-direction: column;gap: 24px;}
        .message {max-width: 85%;padding: 14px 18px;border-radius: 24px;line-height: 1.6;word-wrap: break-word;font-size: 16px;}
        .user-msg {background-color: #303030;color: #e3e3e3;align-self: flex-end;border-bottom-right-radius: 6px;}
        .ai-msg {background-color: transparent;color: #e3e3e3;align-self: flex-start;padding-left: 0;padding-right: 0;}
        
        /* Timer Styling */
        .time-elapsed {display: block;font-size: 12px;color: #a8c7fa;margin-top: 8px;font-family: monospace; opacity: 0.8;}

        /* Gemini Floating Input Pill */
        #input-wrapper {background-color: #1e1f20;margin: 10px 20px 20px 20px;border-radius: 32px;display: flex;align-items: center;padding: 6px 8px 6px 16px;gap: 8px;}
        #model-select {background-color: transparent;color: #a8c7fa;border: none;font-size: 14px;font-weight: 600;outline: none;cursor: pointer;padding: 8px 4px; appearance: none;}
        #model-select option {background-color: #1e1f20;color: #e3e3e3;}
        #chat-input {flex-grow: 1;background-color: transparent;border: none;color: white;padding: 12px 5px;font-size: 16px;outline: none;}
        #chat-input::placeholder {color: #8e8e8e;}
        
        /* Circular Send Button */
        #send-btn {background-color: #a8c7fa;color: #041e49;border: none;width: 42px;height: 42px;border-radius: 50%;font-weight: bold;font-size: 20px;cursor: pointer;display: flex;justify-content: center;align-items: center;transition: opacity 0.2s;flex-shrink: 0;}
        #send-btn:hover {opacity: 0.8;}
        #send-btn:disabled {background-color: #444;color: #888;cursor: not-allowed;}

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            #telemetry-bar {flex-wrap: wrap;justify-content: space-between;gap: 12px;padding: 15px;}
            #telemetry-bar div {width: 45%;text-align: left;}
            #input-wrapper {margin: 10px 12px 15px 12px;padding: 4px 6px 4px 12px;border-radius: 28px;}
            #model-select {max-width: 70px;text-overflow: ellipsis;overflow: hidden;font-size: 13px;}
            .message {max-width: 90%;font-size: 15px;}
            #send-btn {width: 38px;height: 38px;font-size: 18px;}
        }
    </style>
</head>
<body>

    <div id="telemetry-bar">
        <div><span class="stat">TEMP:</span><span class="val" id="sys-temp">-- °C</span></div>
        <div><span class="stat">CPU:</span><span class="val" id="cpu-load">-- / 4.00</span></div>
        <div><span class="stat">VOLT:</span><span class="val" id="core-volt">-- V</span></div>
        <div><span class="stat">RAM:</span><span class="val" id="ram-usage">-- / -- MB</span></div>
    </div>

    <div id="chat-container">
        <div class="message ai-msg">System Online. Qwen2.5-Coder is ready. How can I help you today?</div>
    </div>

    <div id="input-wrapper">
        <select id="model-select">
            <option value="qwen2.5-coder:0.5b">0.5B</option>
            <option value="qwen2.5-coder:1.5b">1.5B</option>
            <option value="qwen2.5-coder:3b">3B</option>
        </select>
        
        <input type="text" id="chat-input" placeholder="Ask me anything..." autocomplete="off">
        <button id="send-btn">↑</button>
    </div>

    <script>
        // --- 1. TELEMETRY POLLING (Apache) ---
        async function fetchTelemetry() {
            try {
                const response = await fetch('https://ai.yong1412.my/telemetry/health.php');
                if (response.ok) {
                    const data = await response.json();
                    
                    // --- CPU Logic ---
                    const cpuRaw = parseFloat(data.cpu_load);
                    const cpuFormatted = cpuRaw.toFixed(2);
                    const cpuElement = document.getElementById('cpu-load');
                    
                    cpuElement.innerText = cpuFormatted + " / 4.00";
                    
                    // Apply conditional colors based on load
                    if (cpuRaw > 6.00) {
                        cpuElement.style.color = "#ff5252"; // Red
                    } else if (cpuRaw > 4.00) {
                        cpuElement.style.color = "#ffeb3b"; // Yellow
                    } else {
                        cpuElement.style.color = "#e3e3e3"; // Default White/Grey
                    }

                    // --- Other Telemetry ---
                    const voltFormatted = parseFloat(data.core_voltage).toFixed(2);
                    const ramUsed = Number(data.ram_used_mb).toLocaleString('en-US').replace(/,/g, '.');
                    const ramTotal = Number(data.ram_total_mb).toLocaleString('en-US').replace(/,/g, '.');

                    document.getElementById('sys-temp').innerText = data.temperature_c + " °C";
                    document.getElementById('core-volt').innerText = voltFormatted + " V";
                    document.getElementById('ram-usage').innerText = ramUsed + " / " + ramTotal + " MB";
                }
            } catch (error) {
                console.error("Telemetry failed:", error);
                document.getElementById('sys-temp').innerText = "OFFLINE";
                document.getElementById('sys-temp').className = "val error-text";
            }
        }
        
        fetchTelemetry();
        setInterval(fetchTelemetry, 500);

        // --- 2. AI CHAT ENGINE (Ollama) ---
        const chatContainer = document.getElementById('chat-container');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        let messageHistory = [];

        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            // 1. Display User Message
            appendMessage(text, 'user-msg');
            chatInput.value = '';
            sendBtn.disabled = true;
            messageHistory.push({ role: "user", content: text });

            // 2. Setup AI UI (Text Area + Live Timer Area)
            const loadingId = "ai-" + Date.now();
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message ai-msg';
            msgDiv.id = loadingId;
            
            const textDiv = document.createElement('div');
            textDiv.innerText = "Thinking...";
            msgDiv.appendChild(textDiv);

            const timerDiv = document.createElement('div');
            timerDiv.className = 'time-elapsed';
            timerDiv.innerText = `⏱️ Processed in 0.00s`;
            msgDiv.appendChild(timerDiv);

            chatContainer.appendChild(msgDiv);
            scrollToBottom();

            // 3. Start Live Timer
            const startTime = performance.now();
            let timerInterval = setInterval(() => {
                const currentElapsed = ((performance.now() - startTime) / 1000).toFixed(2);
                timerDiv.innerText = `⏱️ Processed in ${currentElapsed}s`;
            }, 50);

            try {
                // Grab the currently selected model
                const selectedModel = document.getElementById('model-select').value;

                // 4. Send to Ollama via Stream
                const response = await fetch('https://chat.yong1412.my/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: selectedModel,
                        messages: messageHistory,
                        stream: true, 
                        keep_alive: '5m',
                        options: { num_thread: 4, num_ctx: 1024 }
                    })
                });

                if (!response.ok) throw new Error("AI Server Error");

                // 5. Read Stream Chunks
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullResponse = "";
                let isFirstChunk = true;
                let buffer = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    
                    buffer = lines.pop(); 

                    for (const line of lines) {
                        if (line.trim()) {
                            const data = JSON.parse(line);
                            if (data.message && data.message.content) {
                                if (isFirstChunk) {
                                    textDiv.innerText = "";
                                    isFirstChunk = false;
                                }
                                fullResponse += data.message.content;
                                textDiv.innerText = fullResponse;
                                scrollToBottom();
                            }
                        }
                    }
                }

                // 6. Finalize Time and History
                clearInterval(timerInterval);
                const finalTime = ((performance.now() - startTime) / 1000).toFixed(2);
                timerDiv.innerText = `⏱️ Processed in ${finalTime}s`;
                messageHistory.push({ role: "assistant", content: fullResponse });

            } catch (error) {
                console.error(error);
                clearInterval(timerInterval);
                textDiv.innerText = "ERROR: Could not connect to Qwen2.5 on Raspberry Pi.";
                textDiv.style.color = "#ff5252";
            } finally {
                sendBtn.disabled = false;
                chatInput.focus();
                scrollToBottom();
            }
        }

        function appendMessage(text, className) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.innerText = text;
            chatContainer.appendChild(msgDiv);
            scrollToBottom();
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        chatInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        });

        sendBtn.addEventListener('click', sendMessage);
    </script>
</body>
</html>
